<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>McDonald's RP | Caja rápida</title>
<style>
:root{--red:#da291c;--yellow:#ffc72c;--ink:#222;--muted:#666;--bg:#f5f5f5}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--red);color:white;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:23px}header p{margin:6px 0 0}
main{max-width:900px;margin:16px auto;padding:0 12px}
.panel{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 9px #00000010}
h2{font-size:19px;margin:0 0 12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:9px;padding:11px 13px;font-weight:bold;cursor:pointer}
.tab{background:#eee}.tab.active{background:var(--yellow)}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}
.product{background:#fff;border:1px solid #ddd;text-align:left;padding:12px;border-radius:10px;min-height:75px}
.product strong{display:block;margin-bottom:6px}.price{color:var(--red);font-weight:bold}
.cartline{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:10px 0}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:6px 10px;background:#eee}
.total{font-size:25px;font-weight:bold;text-align:right;margin:14px 0}
.primary{background:var(--red);color:white}.secondary{background:var(--yellow);color:#222}
input{padding:11px;border:1px solid #ccc;border-radius:8px;width:100%;margin:5px 0 10px}
.small{font-size:13px;color:var(--muted)}.hidden{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}
</style>
</head>
<body>
<header><h1>McDonald's RP</h1><p>Caja rápida para trabajadores</p></header>
<main>
<section class="panel" id="login">
<h2>Acceso a caja</h2><label>Contraseña</label><input id="pass" type="password" placeholder="Ingresa tu clave">
<button class="primary" onclick="login()">Ingresar</button><p class="small" id="loginmsg">Demo: trabajador CAJA2026 · gerente GERENCIA2026</p>
</section>
<div id="app" class="hidden">
<section class="panel">
<h2>Menú</h2><div class="tabs" id="tabs"></div><div class="products" id="products"></div>
</section>
<section class="panel">
<h2>Pedido actual</h2><div id="cart"><p class="small">Aún no agregas productos.</p></div>
<div class="total" id="total">Total: $0</div>
<div class="actions"><button class="secondary" onclick="copyOrder()">Copiar pedido</button><button class="primary" onclick="clearCart()">Nuevo pedido</button></div>
</section>
<section class="panel hidden" id="manager">
<h2>Administración de precios</h2><p class="small">Los cambios de esta demo se guardan solo en este navegador.</p>
<div id="priceEditor"></div><button class="primary" onclick="savePrices()">Guardar precios</button>
</section>
</div>
</main>
<script>
const defaults=[
["Combos","Big Mac",4990],["Combos","Cuarto de Libra",4990],["Combos","McNífica",4490],["Combos","McPollo",4490],["Combos","McNuggets 10",4990],
["Hamburguesas","Big Mac",3490],["Hamburguesas","Cuarto de Libra",3490],["Hamburguesas","Cheeseburger",1690],["Hamburguesas","Hamburguesa",1390],
["Acompañamientos","Papas pequeñas",1490],["Acompañamientos","Papas medianas",1890],["Acompañamientos","Papas grandes",2190],["Acompañamientos","McNuggets 6",2490],
["Bebidas","Bebida pequeña",1290],["Bebidas","Bebida mediana",1590],["Bebidas","Bebida grande",1890],["Bebidas","Agua",1190],
["Postres","McFlurry",2490],["Postres","Sundae",1690],["Postres","Cono",990]
];
let items=JSON.parse(localStorage.getItem("rpItems")||"null")||defaults.map(x=>({cat:x[0],name:x[1],price:x[2]}));
let cart={},role="",category="Combos";
const money=n=>"$"+Number(n).toLocaleString("es-CL");
function login(){let p=document.getElementById("pass").value;if(p==="CAJA2026"||p==="GERENCIA2026"){role=p==="GERENCIA2026"?"manager":"worker";document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("manager").classList.toggle("hidden",role!=="manager");render();}else document.getElementById("loginmsg").textContent="Clave incorrecta. Inténtalo nuevamente."}
function render(){let cats=[...new Set(items.map(x=>x.cat))];document.getElementById("tabs").innerHTML=cats.map(c=>`<button class="tab ${c===category?"active":""}" onclick="category=${JSON.stringify(c)};render()">${c}</button>`).join("");document.getElementById("products").innerHTML=items.filter(x=>x.cat===category).map((x)=>`<button class="product" onclick="add(${items.indexOf(x)})"><strong>${x.name}</strong><span class="price">${money(x.price)}</span></button>`).join("");renderCart();if(role==="manager")renderEditor()}
function add(i){cart[i]=(cart[i]||0)+1;renderCart()}
function change(i,d){cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];renderCart()}
function renderCart(){let keys=Object.keys(cart);document.getElementById("cart").innerHTML=keys.length?keys.map(i=>`<div class="cartline"><div>${items[i].name}<br><span class="small">${money(items[i].price)} c/u</span></div><div class="qty"><button onclick="change(${i},-1)">−</button><b>${cart[i]}</b><button onclick="change(${i},1)">+</button></div><b>${money(items[i].price*cart[i])}</b></div>`).join(""):'<p class="small">Aún no agregas productos.</p>';let total=keys.reduce((s,i)=>s+items[i].price*cart[i],0);document.getElementById("total").textContent="Total: "+money(total)}
function clearCart(){cart={};renderCart()}
function copyOrder(){let keys=Object.keys(cart);if(!keys.length)return alert("Agrega productos primero.");let lines=keys.map(i=>`${cart[i]}x ${items[i].name} — ${money(items[i].price*cart[i])}`);let total=keys.reduce((s,i)=>s+items[i].price*cart[i],0);let msg="🍟 **PEDIDO McDonald's RP**\n"+lines.join("\n")+"\n**TOTAL: "+money(total)+"**";if(navigator.clipboard?.writeText)navigator.clipboard.writeText(msg).then(()=>alert("Pedido copiado para Discord."));else alert(msg)}
function renderEditor(){document.getElementById("priceEditor").innerHTML=items.map((x,i)=>`<label>${x.name} (${x.cat})</label><input type="number" min="0" id="price${i}" value="${x.price}">`).join("")}
function savePrices(){items=items.map((x,i)=>({...x,price:Math.max(0,Number(document.getElementById("price"+i).value)||0)}));localStorage.setItem("rpItems",JSON.stringify(items));render();alert("Precios guardados en este navegador.")}
</script>
</body></html>
